<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo phòng chat</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:"Segoe UI", sans-serif;
    }

    body{
        background: linear-gradient(135deg, #1fa2ff, #12d8fa, #a6ffcb);
        padding:20px;
        display:flex;
        justify-content:center;
    }

    #container{
        width:100%;
        max-width:420px;
        background:rgba(255,255,255,0.25);
        backdrop-filter: blur(14px);
        padding:22px;
        border-radius:18px;
        box-shadow:0 8px 25px rgba(0,0,0,0.25);
        animation: fadeInUp 0.5s ease;
    }

    @keyframes fadeInUp {
        from { transform:translateY(25px); opacity:0; }
        to { transform:translateY(0); opacity:1; }
    }

    h2{
        text-align:center;
        color:white;
        margin-bottom:20px;
        font-size:26px;
        text-shadow:0 2px 3px rgba(0,0,0,0.3);
    }

    h3{
        color:white;
        margin:12px 0;
        font-size:18px;
    }

    .input-box input{
        width:100%;
        padding:14px;
        font-size:16px;
        border-radius:12px;
        border:none;
        outline:none;
        background:rgba(255,255,255,0.95);
        margin-bottom:12px;
    }

    #userList{
        max-height:300px;
        overflow-y:auto;
        background:rgba(255,255,255,0.9);
        border-radius:12px;
        padding:10px;
        border:none;
    }

    .user-row{
        padding:10px;
        display:flex;
        align-items:center;
        gap:12px;
        border-bottom:1px solid #eee;
        font-size:16px;
    }

    .user-row:last-child{
        border-bottom:none;
    }

    .user-row:hover{
        background:#f3faff;
        border-radius:6px;
        cursor:pointer;
    }

    .user-row input{
        width:20px;
        height:20px;
    }

    #btnBox{
        display:flex;
        justify-content:space-between;
        margin-top:20px;
        gap:10px;
    }

    .btn{
        flex:1;
        padding:14px;
        border:none;
        border-radius:12px;
        font-size:17px;
        font-weight:600;
        cursor:pointer;
        color:white;
    }

    #backBtn{ background:#9e9e9e; }
    #createBtn{ background:#0066ff; }

    #createBtn:hover{ background:#0050cc; }
    #backBtn:hover{ background:#7e7e7e; }

    #loading{
        margin-top:10px;
        text-align:center;
        color:white;
    }
</style>
</head>

<body>

<div id="container">

    <h2>➕ Tạo Phòng Chat</h2>

    <div class="input-box">
        <input id="roomName" placeholder="Tên phòng..." />
    </div>

    <h3>Chọn thành viên</h3>

    <div id="userList">Đang tải...</div>

    <div id="btnBox">
        <button class="btn" id="backBtn" onclick="window.location.href='chat.html'">⬅ Quay lại</button>
        <button class="btn" id="createBtn">Tạo phòng ✔</button>
    </div>

    <div id="loading" style="display:none;">🔄 Đang xử lý...</div>

</div>


<script>
const API_URL = "http://localhost:3000/api";
let token = localStorage.getItem("token");

if (!token) {
    alert("Bạn chưa đăng nhập!");
    location.href = "login.html";
}

/* ===========================
   LOAD USER
=========================== */
async function loadUsers(){
    try{
        let res = await fetch(`${API_URL}/accounts/except-me`, {
            headers:{ Authorization:"Bearer "+token }
        });

        let data = await res.json();
        userList.innerHTML = "";

        if(!data.users || data.users.length===0){
            userList.innerHTML = "<i>Không có người dùng!</i>";
            return;
        }

        data.users.forEach(u=>{
            let row = document.createElement("div");
            row.className = "user-row";

            row.innerHTML = `
                <input type="checkbox" value="${u._id}">
                <span><b>${u.fullName}</b> (${u.username})</span>
            `;

            row.onclick = (e)=>{
                if(e.target.tagName !== "INPUT"){
                    let cb = row.querySelector("input");
                    cb.checked = !cb.checked;
                }
            };

            userList.appendChild(row);
        });

    }catch(e){
        userList.innerHTML = "<i>Lỗi tải danh sách!</i>";
    }
}

loadUsers();

/* ===========================
   TẠO PHÒNG
=========================== */
createBtn.onclick = async ()=>{
    let name = roomName.value.trim();
    if(!name) return alert("Tên phòng không được bỏ trống!");

    let memberIds = [...document.querySelectorAll("#userList input:checked")]
                        .map(i=>i.value);

    if(memberIds.length===0){
        return alert("Hãy chọn ít nhất 1 thành viên!");
    }

    createBtn.disabled = true;
    loading.style.display = "block";

    try{
        let res = await fetch(`${API_URL}/rooms/create`,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer "+token
            },
            body:JSON.stringify({ name, members:memberIds })
        });

        let data = await res.json();

        if(!res.ok){
            alert(data.message || "Lỗi tạo phòng!");
        }else{
            alert("✔ Tạo phòng thành công!");
            location.href = "chat.html";
        }
    }
    catch(err){
        alert("Lỗi server!");
    }

    createBtn.disabled = false;
    loading.style.display = "none";
};
</script>

</body>
</html>
